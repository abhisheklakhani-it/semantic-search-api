services:
  qdrant:
    image: qdrant/qdrant:v1.19.1
    ports:
      - "6333:6333" # REST API and web dashboard (http://localhost:6333/dashboard)
    volumes:
      - qdrant-data:/qdrant/storage # keeps the vectors when the container is recreated
    healthcheck:
      # The Qdrant image has no curl, so open a TCP connection with bash instead.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    image: semantic-search-api:latest
    ports:
      - "${API_PORT:-8000}:8000" # API_PORT=8080 docker compose up, if 8000 is taken
    environment:
      - SEMSEARCH_QDRANT_URL=http://qdrant:6333
      # ONNX threads per model: 4 was fastest on an 8-core Apple M2 (4 performance cores). Set it to your
      # number of physical performance cores.
      - SEMSEARCH_MODEL_THREADS=${SEMSEARCH_MODEL_THREADS:-4}
      # Passed through from your shell when set (used by the benchmark), otherwise the defaults apply.
      - SEMSEARCH_COLLECTION
      - SEMSEARCH_CHUNK_SIZE
    env_file:
      - path: .env
        required: false
    depends_on:
      qdrant:
        condition: service_healthy

volumes:
  qdrant-data:
